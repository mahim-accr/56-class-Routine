<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Class Routine</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#1c3a30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()">
<style>
  :root{
    --board-bg:#1c3a30;
    --board-bg-2:#20443a;
    --amber:#f2c94c;
    --amber-dim:#8a7a3f;
    --paper:#f4f1e4;
    --ink:#132720;
    --line:rgba(244,241,228,0.22);
    --off-day:#7fa596;

    --c-ai:#c9a6f2;
    --c-ailab:#f2a6c5;
    --c-ps:#8ecbf2;
    --c-ca:#6fa8dc;
    --c-toc:#7fd9c4;
    --c-spd:#9bd67f;
    --c-fma:#f2c14e;
    --c-lpl:#f2965a;
    --c-cn:#f4dd6e;
    --c-cnlab:#e39fb5;
  }

   
  :root[data-theme="sun"]{  
    --board-bg:#1c3a30; --board-bg-2:#20443a; --amber:#f2c94c; --amber-dim:#8a7a3f; --off-day:#7fa596;
  }
  :root[data-theme="mon"]{  
    --board-bg:#182849; --board-bg-2:#1d3157; --amber:#6fc7f2; --amber-dim:#4f7a8a; --off-day:#7f9bc9;
  }
  :root[data-theme="tue"]{  
    --board-bg:#3a1c28; --board-bg-2:#44202f; --amber:#f2c94c; --amber-dim:#8a6f3f; --off-day:#c98aa0;
  }
  :root[data-theme="wed"]{  
    --board-bg:#271c3a; --board-bg-2:#2f2144; --amber:#c9a6f2; --amber-dim:#7a638a; --off-day:#a695c9;
  }
  :root[data-theme="thu"]{  
    --board-bg:#123a35; --board-bg-2:#15453f; --amber:#7fe0c4; --amber-dim:#4f8a7a; --off-day:#7fc9ba;
  }
  :root[data-theme="fri"]{  
    --board-bg:#24262b; --board-bg-2:#2c2f35; --amber:#f2c14e; --amber-dim:#8a7d4f; --off-day:#9aa0a6;
  }
  :root[data-theme="sat"]{  
    --board-bg:#3a2a18; --board-bg-2:#44321d; --amber:#f2965a; --amber-dim:#8a6a4f; --off-day:#c9ab7f;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board-bg);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    position:relative;
    overflow-x:hidden;
    transition:background-color .8s ease, color .8s ease;
  }

  /* ---------- chalkboard atmosphere: smudges + drifting dust ---------- */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 30% at 10% 5%, rgba(244,241,228,0.05), transparent 60%),
      radial-gradient(ellipse 40% 25% at 95% 0%, rgba(244,241,228,0.04), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,0,0,0.18), transparent 65%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:-10% -10%;
    z-index:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(rgba(244,241,228,0.5) 1px, transparent 1.4px),
      radial-gradient(rgba(244,241,228,0.35) 1px, transparent 1.4px);
    background-size:140px 140px, 210px 210px;
    background-position:0 0, 60px 90px;
    animation:dustDrift 22s linear infinite;
  }
  @keyframes dustDrift{
    0%{ background-position:0 0, 60px 90px; }
    100%{ background-position:40px 260px, 100px 350px; }
  }
  .board-frame{ position:relative; z-index:1; transition:background-color .8s ease; }
  .select-overlay{ z-index:50; }

  .board-frame{
    max-width:640px;
    margin:0 auto;
    padding:0 0 24px;
  }

  header.hero{
    padding:30px 20px 20px;
    border-bottom:2px dashed rgba(244,241,228,0.28);
    background:var(--board-bg-2);
    position:relative;
    overflow:hidden;
    transition:background-color .8s ease, border-color .8s ease;
  }
  header.hero::before{
    content:"UNIVERSITY TIMETABLE SYSTEM";
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:3px;
    color:var(--off-day);
    margin-bottom:8px;
    animation:fadeSlideUp .5s ease both;
  }
  h1{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:clamp(30px,7.4vw,42px);
    margin:0 0 4px;
    letter-spacing:0.2px;
    line-height:1.08;
    color:var(--paper);
    transform:rotate(-0.6deg);
    animation:fadeSlideUp .55s ease both .06s;
    position:relative;
    display:inline-block;
  }
  h1 span{
    color:var(--amber);
    position:relative;
    display:inline-block;
  }
  h1 span::after{
    content:"";
    position:absolute;
    left:-2%; right:-2%; bottom:-6px;
    height:10px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 14'><path d='M2 8 Q 12 2, 22 8 T 42 8 T 62 8 T 82 8 T 102 8 T 122 8' fill='none' stroke='%23f2c94c' stroke-width='3.4' stroke-linecap='round'/></svg>");
    background-repeat:repeat-x;
    background-size:60px 10px;
    clip-path:inset(0 100% 0 0);
    animation:chalkDraw .7s ease forwards .5s;
  }
  @keyframes chalkDraw{
    0%{ clip-path:inset(0 100% 0 0); }
    100%{ clip-path:inset(0 0% 0 0); }
  }
  .subhead{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--off-day);
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    flex-wrap:wrap;
    gap:6px;
    animation:fadeSlideUp .55s ease both .16s;
  }
  .subhead b{color:var(--amber); font-weight:700;}

  @keyframes fadeSlideUp{
    0%{ opacity:0; transform:translateY(8px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  .section-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--amber);
    background:rgba(244,241,228,0.05);
    border:2px dashed var(--amber-dim);
    padding:5px 12px;
    border-radius:14px 4px 14px 4px;
    animation:fadeSlideUp .5s ease both;
    transition:border-color .2s ease, background .2s ease;
  }
  .section-badge:hover{
    border-color:var(--amber);
    background:rgba(244,241,228,0.09);
  }
  .section-badge button{
    border:none;
    background:none;
    color:var(--off-day);
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-decoration-style:dashed;
  }

  nav.days{
    display:flex;
    overflow-x:auto;
    background:var(--board-bg-2);
    border-bottom:2px dashed rgba(244,241,228,0.2);
    position:sticky;
    top:0;
    z-index:5;
    scrollbar-width:none;
    padding-top:4px;
    transition:background-color .8s ease, border-color .8s ease;
  }
  nav.days::-webkit-scrollbar{display:none;}
  nav.days button{
    flex:1 0 auto;
    min-width:76px;
    background:none;
    border:none;
    color:var(--off-day);
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    padding:14px 10px 12px;
    cursor:pointer;
    position:relative;
    transition:color .2s ease;
  }
  nav.days button:hover{color:var(--paper);}
  nav.days button .full{display:block; font-family:'Kalam',cursive; font-weight:700; font-size:15px; letter-spacing:0; margin-top:2px; color:inherit;}
  nav.days button.active{color:var(--amber);}
  nav.days button.active::before{
    content:"";
    position:absolute;
    left:6%; right:6%; bottom:4px; top:2px;
    border:2.5px solid var(--amber);
    border-radius:52% 48% 47% 53% / 58% 44% 56% 42%;
    transform:rotate(-2deg);
    opacity:0;
    animation:chalkLoop .5s ease forwards;
    pointer-events:none;
  }
  @keyframes chalkLoop{
    0%{ opacity:0; transform:rotate(-6deg) scale(.85); }
    60%{ opacity:1; transform:rotate(1deg) scale(1.03); }
    100%{ opacity:1; transform:rotate(-2deg) scale(1); }
  }
  nav.days button .dot{
    display:none;
    width:6px;height:6px;border-radius:50%;background:var(--amber);
    position:absolute; top:6px; right:16px;
    animation:blink 1.4s infinite;
  }
  nav.days button.is-today .dot{display:block;}

  .board{padding:16px 16px 4px;}

  .empty-day{
    font-family:'Space Mono',monospace;
    color:var(--off-day);
    text-align:center;
    padding:60px 20px;
    font-size:14px;
    letter-spacing:2px;
    border:2px dashed rgba(244,241,228,0.22);
    border-radius:16px 6px 16px 6px;
    margin-top:8px;
  }
  .empty-day .big{
    display:block;
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:24px;
    color:var(--paper);
    letter-spacing:0.5px;
    margin-bottom:10px;
    transform:rotate(-1deg);
  }

  .row{
    display:grid;
    grid-template-columns:78px 1fr 62px;
    gap:12px;
    align-items:center;
    padding:14px 10px;
    border-bottom:2px dashed rgba(244,241,228,0.14);
    position:relative;
    border-radius:6px;
    transition:background .2s ease, transform .2s ease;
  }
  .row:nth-child(odd){ transform:rotate(-0.15deg); }
  .row:nth-child(even){ transform:rotate(0.15deg); }
  .row:last-child{border-bottom:none;}
  .row:hover{background:rgba(244,241,228,0.04); transform:translateX(2px) rotate(0deg);}

  .row.now{
    animation:flipIn .38s ease both;
    background:rgba(242,201,76,0.07);
    border-radius:10px;
    box-shadow:0 0 0 2px transparent;
  }
  .row.now::before{
    content:"";
    position:absolute;
    inset:2px;
    border:2.5px dashed var(--amber);
    border-radius:14px 6px 14px 6px;
    opacity:.85;
    animation:chalkWobble 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  .row.now::after{
    content:"★";
    position:absolute;
    top:-9px; right:6px;
    font-size:13px;
    color:var(--amber);
    transform:rotate(-8deg);
  }
  @keyframes chalkWobble{
    0%,100%{ transform:rotate(-0.4deg) scale(1); opacity:.8; }
    50%{ transform:rotate(0.4deg) scale(1.004); opacity:1; }
  }

  .time{
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    line-height:1.35;
    color:#c7d6cd;
    letter-spacing:0.5px;
  }
  .row.now .time{color:var(--amber);}

  .seq{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--off-day);
    display:block;
    margin-bottom:3px;
  }

  .subject-wrap{min-width:0;}
  .chip{
    display:inline-block;
    position:relative;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.1px;
    color:var(--ink);
    padding:5px 11px;
    border-radius:12px 4px 12px 4px;
    line-height:1.2;
    max-width:100%;
    box-shadow:0 2px 6px -2px rgba(0,0,0,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .row:hover .chip{ transform:translateY(-1px) rotate(-0.6deg); box-shadow:0 4px 10px -2px rgba(0,0,0,0.4); }
  .chip::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 48%, transparent 65%);
    transform:translateX(-120%);
  }
  .row.now .chip::after{ animation:chipSheen 3.2s ease-in-out infinite; }
  @keyframes chipSheen{
    0%{ transform:translateX(-120%); }
    35%,100%{ transform:translateX(120%); }
  }
  .faculty{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--off-day);
    margin-top:6px;
    letter-spacing:1px;
  }

  .gate{
    font-family:'Space Mono',monospace;
    text-align:right;
  }
  .gate .lbl{display:block; font-size:8.5px; color:var(--off-day); letter-spacing:1.5px; margin-bottom:2px;}
  .gate .num{
    font-size:14px;
    font-weight:700;
    color:var(--paper);
    border:2px dashed rgba(244,241,228,0.3);
    border-radius:8px 3px 8px 3px;
    padding:3px 7px;
    display:inline-block;
  }
  .row.now .gate .num{border-color:var(--amber); color:var(--amber); border-style:solid;}

  /* ---------- break time row ---------- */
  .row.break{
    opacity:.72;
    padding:10px 10px;
  }
  .row.break:hover{ transform:none; background:none; }
  .row.break .time{color:var(--off-day);}
  .break-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--off-day);
    padding:5px 11px;
    border:2px dashed rgba(244,241,228,0.22);
    border-radius:12px 4px 12px 4px;
  }

  /* ---------- test / note badge + button ---------- */
  .row.has-note{
    background:rgba(242,148,90,0.06);
  }
  .row.has-note::before{
    content:"";
    position:absolute;
    left:0; top:8px; bottom:8px;
    width:3px;
    background:var(--c-lpl, #f2965a);
    border-radius:2px;
  }
  .note-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:10px;
    letter-spacing:1px;
    color:#f2965a;
    margin-top:6px;
    padding:2px 8px;
    border:1.5px dashed rgba(242,150,90,0.55);
    border-radius:8px 3px 8px 3px;
  }
  .note-btn{
    display:inline-block;
    margin-top:6px;
    background:none;
    border:none;
    padding:0;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:1px;
    color:var(--off-day);
    text-decoration:underline;
    text-decoration-style:dashed;
    cursor:pointer;
  }
  .note-btn:hover{color:var(--amber);}

  .select-card input[type="text"]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:2px dashed rgba(244,241,228,0.35);
    color:var(--paper);
    font-family:'Kalam',cursive;
    font-size:20px;
    text-align:center;
    padding:8px 4px 12px;
    outline:none;
    transition:border-color .18s ease;
  }
  .select-card input[type="text"]:focus{border-color:var(--amber);}
  .select-card input[type="text"]::placeholder{color:var(--off-day); opacity:.6;}
  .select-options.note-actions button{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:1px;
    padding:14px 8px;
  }

  .status-banner{
    margin:14px 16px 0;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:rgba(242,201,76,0.08);
    border:2px dashed var(--amber-dim);
    border-radius:10px 3px 10px 3px;
    animation:fadeSlideUp .4s ease both;
  }
  .status-banner .blink{
    width:6px;height:6px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px rgba(242,201,76,0.7);
    animation:blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  footer.note{
    text-align:center;
    padding:28px 20px 0;
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--off-day);
    letter-spacing:1.5px;
    line-height:2.1;
    animation:fadeSlideUp .6s ease both .1s;
  }
  footer.note b{
    display:block;
    font-family:'Kalam',cursive;
    color:var(--amber);
    font-size:14px;
    letter-spacing:0.5px;
    font-weight:700;
  }

  .update-tag{
    display:block;
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed rgba(244,241,228,0.16);
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    color:var(--off-day);
    letter-spacing:1.2px;
  }
  .update-tag .ver{color:var(--amber-dim); font-weight:700;}
  .update-tag .lbl2{color:var(--off-day);}

  /* flip-in animation when switching days */
  @keyframes flipIn{
    0%{ transform:rotateX(90deg); opacity:0; }
    60%{ transform:rotateX(-8deg); opacity:1; }
    100%{ transform:rotateX(0); opacity:1; }
  }
  .row, .empty-day{
    transform-origin:top center;
    animation:flipIn .38s ease both;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    body::before, body::after{display:none;}
  }

   
  .select-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(242,201,76,0.07), transparent 65%),
      var(--board-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
    animation:overlayFade .3s ease both;
  }
  @keyframes overlayFade{ 0%{opacity:0;} 100%{opacity:1;} }
  .select-card{
    max-width:380px;
    width:100%;
    text-align:center;
    animation:cardRise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardRise{
    0%{ opacity:0; transform:translateY(18px) scale(.98); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .select-card .kicker{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:3px;
    color:var(--amber-dim);
    margin-bottom:12px;
  }
  .select-card h2{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:28px;
    margin:0 0 8px;
    color:var(--paper);
    transform:rotate(-0.5deg);
  }
  .select-card p{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    color:var(--off-day);
    line-height:1.7;
    margin:0 0 30px;
    letter-spacing:0.5px;
  }
  .select-options{
    display:flex;
    gap:14px;
  }
  .select-options.three button{font-size:20px;}
  .select-options button{
    flex:1;
    padding:24px 8px;
    border-radius:16px 6px 16px 6px;
    border:2.5px dashed rgba(244,241,228,0.3);
    background:var(--board-bg-2);
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--paper);
    cursor:pointer;
    transition:border-color .18s ease, color .18s ease, transform .18s ease, background .18s ease;
    animation:fadeSlideUp .4s ease both;
  }
  .select-options button:nth-child(1){animation-delay:.04s;}
  .select-options button:nth-child(2){animation-delay:.1s;}
  .select-options button:nth-child(3){animation-delay:.16s;}
  .select-options button:hover,
  .select-options button:active{
    border-color:var(--amber);
    border-style:solid;
    color:var(--amber);
    background:rgba(242,201,76,0.08);
    transform:translateY(-3px) rotate(-0.8deg);
  }
  .select-options .tag{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:1.5px;
    color:var(--off-day);
    margin-top:6px;
  }
  #installAppBtn{
    animation:installPulse 2.4s ease-in-out infinite;
    transition:transform .15s ease;
  }
  #installAppBtn:hover{ transform:translateX(-50%) scale(1.04); }
  @keyframes installPulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 rgba(242,201,76,0); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 16px rgba(242,201,76,0.55); }
  }

  .back-link{
    display:inline-block;
    margin-top:22px;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--off-day);
    text-decoration:underline;
    text-decoration-style:dashed;
    cursor:pointer;
    background:none;
    border:none;
  }
</style>
</head>
<body>

<div id="selectOverlay" class="select-overlay" style="display:none;">
  <div class="select-card" id="selectCardInner"></div>
</div>

<div id="noteOverlay" class="select-overlay" style="display:none;">

  document.documentElement.setAttribute("data-theme", theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", THEME_COLORS[theme]);
}

function fmt(t){
  let [h,m] = t;
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if(h12===0) h12=12;
  return `${h12}:${m.toString().padStart(2,"0")} ${ap}`;
}
function minutes(t){ return t[0]*60 + t[1]; }

const now = new Date();
const nowDow = now.getDay();
const nowMin = now.getHours()*60 + now.getMinutes();

const overlay = document.getElementById("selectOverlay");
const selectCardInner = document.getElementById("selectCardInner");
const noteOverlay = document.getElementById("noteOverlay");
const noteCardInner = document.getElementById("noteCardInner");
const sectionBadge = document.getElementById("sectionBadge");
const pageTitle = document.getElementById("pageTitle");
const dayNav = document.getElementById("dayNav");

const SEC_KEY = "routine-section";
const GRP_KEY = "routine-group";
const NOTES_KEY = "routine-notes";

let currentSection = null;
let currentGroup = null;
let activeDow = null;
let DATA = null;
let lastVisibleClasses = [];

function loadNotes(){
  try{ return JSON.parse(localStorage.getItem(NOTES_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveNotes(notes){
  localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}
function noteKey(section, dow, idx){
  return `${section}-${dow}-${idx}`;
}
function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[m]));
}

function renderUpdateTag(){
  const tag = document.getElementById("updateTag");
  if(!tag) return;
  tag.innerHTML = `<span class="lbl2">Routine Last Updated:</span> <span class="ver">${LAST_UPDATED_DATE}</span> <span class="lbl2">at</span> <span class="ver">${LAST_UPDATED_TIME}</span>`;
}
renderUpdateTag();

function buildDayNav(){
  dayNav.innerHTML = "";
  DATA.forEach(d=>{
    const btn = document.createElement("button");
    btn.dataset.dow = d.dow;
    btn.innerHTML = `${d.label}<span class="full">${d.full.slice(0,3)}</span><span class="dot"></span>`;
    if(d.dow===nowDow) btn.classList.add("is-today");
    btn.addEventListener("click", ()=>{ activeDow = d.dow; render(); });
    dayNav.appendChild(btn);
  });
}

function render(){
  document.querySelectorAll("nav.days button").forEach(b=>{
    b.classList.toggle("active", parseInt(b.dataset.dow)===activeDow);
  });

  const day = DATA.find(d=>d.dow===activeDow);
  const board = document.getElementById("board");
  board.innerHTML = "";

  const banner = document.getElementById("statusBanner");
  const statusText = document.getElementById("statusText");
  banner.style.display = "none";

  const visibleClasses = day.classes
    .map((c, idx) => ({...c, _idx: idx}))
    .filter(c => !c.batch || c.batch === currentGroup);

  lastVisibleClasses = visibleClasses;

  if(visibleClasses.length === 0){
    board.innerHTML = `<div class="empty-day"><span class="big">NO CLASSES</span>Enjoy your ${day.full}.</div>`;
    return;
  }

  let currentIdx = -1, nextIdx = -1;
  if(day.dow === nowDow){
    visibleClasses.forEach((c,i)=>{
      const s = minutes(c.start), e = minutes(c.end);
      if(nowMin >= s && nowMin < e) currentIdx = i;
      if(nextIdx === -1 && nowMin < s) nextIdx = i;
    });
  }

  if(currentIdx > -1){
    const c = visibleClasses[currentIdx];
    banner.style.display = "flex";
    statusText.textContent = `IN PROGRESS · ${SUBJECTS[c.subj].name.toUpperCase()} ENDS ${fmt(c.end)}`;
  } else if(nextIdx > -1){
    const c = visibleClasses[nextIdx];
    banner.style.display = "flex";
    statusText.textContent = `NEXT UP · ${SUBJECTS[c.subj].name.toUpperCase()} AT ${fmt(c.start)}`;
  }

  const notes = loadNotes();

  /* build a display list that interleaves BREAK TIME rows into any
     gap between two consecutive classes */
  const items = [];
  visibleClasses.forEach((c,i)=>{
    items.push({type:"class", data:c, seq:i});
    if(i < visibleClasses.length - 1){
      const gapStart = minutes(c.end);
      const gapEnd = minutes(visibleClasses[i+1].start);
      if(gapEnd > gapStart){
        items.push({type:"break", start:c.end, end:visibleClasses[i+1].start});
      }
    }
  });

  items.forEach((item, rowI)=>{
    const row = document.createElement("div");
    row.style.animationDelay = (rowI*0.045)+"s";

    if(item.type === "break"){
      row.className = "row break";
      row.innerHTML = `
        <div class="time">${fmt(item.start)}<br>– ${fmt(item.end)}</div>
        <div class="subject-wrap"><span class="break-chip">☕ BREAK TIME</span></div>
        <div class="gate"></div>
      `;
      board.appendChild(row);
      return;
    }

    const c = item.data;
    const i = item.seq;
    const subj = SUBJECTS[c.subj];
    const note = notes[noteKey(currentSection, day.dow, c._idx)];

    row.className = "row" + (i===currentIdx ? " now" : "") + (note ? " has-note" : "");
    row.innerHTML = `
      <div class="time"><span class="seq">${(i+1).toString().padStart(2,"0")}</span>${fmt(c.start)}<br>– ${fmt(c.end)}</div>
      <div class="subject-wrap">
        <span class="chip" style="background:${subj.color}">${subj.name}</span>
        <span class="faculty">${c.fac}</span>
        ${note ? `<span class="note-badge">📌 ${escapeHtml(note)}</span>` : ""}
        <button class="note-btn" data-idx="${c._idx}">${note ? "✎ edit note" : "+ add note"}</button>
      </div>
      <div class="gate"><span class="lbl">ROOM</span><span class="num">${c.room}${c.batch ? " " + c.batch : ""}</span></div>
    `;
    board.appendChild(row);
  });
}

document.getElementById("board").addEventListener("click", (e)=>{
  const btn = e.target.closest(".note-btn");
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const c = lastVisibleClasses.find(cl => cl._idx === idx);
  if(!c) return;
  showNoteModal(idx, SUBJECTS[c.subj].name);
});

function showNoteModal(idx, subjName){
  const day = DATA.find(d=>d.dow===activeDow);
  const key = noteKey(currentSection, day.dow, idx);
  const notes = loadNotes();
  const existing = notes[key] || "";

  noteOverlay.style.display = "flex";
  noteCardInner.innerHTML = `
    <div class="kicker">CLASS NOTE</div>
    <h2>${escapeHtml(subjName)}</h2>
    <p>Class test, exam বা যেকোনো reminder<br>এখানে লিখে রাখুন। শুধু এই ডিভাইসে সেভ থাকবে।</p>
    <input id="noteInput" type="text" maxlength="40" placeholder="যেমন: Class Test" value="${escapeHtml(existing)}">
    <div class="select-options note-actions" style="margin-top:22px;">
      <button id="noteSaveBtn">SAVE</button>
      ${existing ? '<button id="noteDeleteBtn">REMOVE</button>' : ""}
    </div>
    <button class="back-link" id="noteCancelBtn">‹ CANCEL</button>
  `;

  const input = document.getElementById("noteInput");
  input.focus();
  input.select();

  document.getElementById("noteSaveBtn").addEventListener("click", ()=>{
    const val = input.value.trim();
    const notes2 = loadNotes();
    if(val){ notes2[key] = val; } else { delete notes2[key]; }
    saveNotes(notes2);
    noteOverlay.style.display = "none";
    render();
  });

  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") document.getElementById("noteSaveBtn").click();
  });

  const delBtn = document.getElementById("noteDeleteBtn");
  if(delBtn){
    delBtn.addEventListener("click", ()=>{
      const notes2 = loadNotes();
      delete notes2[key];
      saveNotes(notes2);
      noteOverlay.style.display = "none";
      render();
    });
  }

  document.getElementById("noteCancelBtn").addEventListener("click", ()=>{
    noteOverlay.style.display = "none";
  });
}

function tickClock(){
  const d = new Date();
  const days=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  document.getElementById("clock").textContent =
    `${days[d.getDay()]} ${fmt([d.getHours(), d.getMinutes()])}`;
}
tickClock();
setInterval(tickClock, 15000);
setInterval(()=>{ if(currentSection) render(); }, 30000);

function updateBadge(){
  sectionBadge.innerHTML = `
    <div class="section-badge">
      ${currentSection} · GROUP ${currentGroup}
      <button id="changeBtn">CHANGE</button>
    </div>`;
  document.getElementById("changeBtn").addEventListener("click", showSectionStep);
}

function startWith(section, group){
  currentSection = section;
  currentGroup = group;
  DATA = SECTIONS[section].days;
  pageTitle.innerHTML = `SECTION <span>${section}</span>`;
  activeDow = DATA.some(d=>d.dow===nowDow) ? nowDow : DATA[0].dow;

  overlay.style.display = "none";
  buildDayNav();
  updateBadge();
  render();
}

function saveAndStart(section, group){
  localStorage.setItem(SEC_KEY, section);
  localStorage.setItem(GRP_KEY, group);
  startWith(section, group);
}

function showGroupStep(section){
  const groups = SECTIONS[section].groups;
  selectCardInner.innerHTML = `
    <div class="kicker">GROUP SELECT</div>
    <h2>Choose Your Group</h2>
    <p>Section ${section} splits into ${groups.join(" / ")}<br>for lab classes. Saved on this device.</p>
    <div class="select-options">
      ${groups.map(g => `<button data-group="${g}">${g}<span class="tag">GROUP ${g}</span></button>`).join("")}
    </div>
    <button class="back-link" id="backBtn">‹ BACK TO SECTION</button>
  `;
  selectCardInner.querySelectorAll("[data-group]").forEach(btn=>{
    btn.addEventListener("click", ()=> saveAndStart(section, btn.dataset.group));
  });
  document.getElementById("backBtn").addEventListener("click", showSectionStep);
}

function showSectionStep(){
  overlay.style.display = "flex";
  const sections = Object.keys(SECTIONS);
  selectCardInner.innerHTML = `
    <div class="kicker">SECTION SELECT</div>
    <h2>Choose Your Section</h2>
    <p>Selected once, this is saved<br>on this device.</p>
    <div class="select-options three">
      ${sections.map(s => `<button data-section="${s}">${s}</button>`).join("")}
    </div>
  `;
  selectCardInner.querySelectorAll("[data-section]").forEach(btn=>{
    btn.addEventListener("click", ()=> showGroupStep(btn.dataset.section));
  });
}

const savedSection = localStorage.getItem(SEC_KEY);
const savedGroup = localStorage.getItem(GRP_KEY);

if(savedSection && SECTIONS[savedSection] && savedGroup && SECTIONS[savedSection].groups.includes(savedGroup)){
  startWith(savedSection, savedGroup);
} else {
  showSectionStep();
}

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

 
(function(){
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  const btn = document.createElement("button");
  btn.id = "installAppBtn";
  btn.textContent = "📲 Install App";
  btn.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#f2c94c;color:#132720;font-weight:700;border:none;border-radius:999px;padding:12px 22px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.4);display:none;cursor:pointer;font-family:inherit;";
  document.body.appendChild(btn);

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = "block";
  });

  btn.addEventListener("click", async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.style.display = "none";
    } else if(isIOS){
      showIOSHint();
    }
  });

  window.addEventListener("appinstalled", ()=>{
    btn.style.display = "none";
  });

  function showIOSHint(){
    let hint = document.getElementById("iosInstallHint");
    if(hint){ hint.style.display = "flex"; return; }
    hint = document.createElement("div");
    hint.id = "iosInstallHint";
    hint.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;font-family:inherit;";
    hint.innerHTML = `
      <div style="background:#20443a;color:#f4f1e4;width:100%;max-width:420px;border-radius:20px 20px 0 0;padding:20px;text-align:center;border-top:2px dashed rgba(244,241,228,0.25);">
        <p style="margin:0 0 10px;font-weight:700;">Install করতে নিচের ধাপগুলো অনুসরণ করুন:</p>
        <p style="margin:0 0 6px;">1. নিচের Share বাটনে (⬆️) ট্যাপ করুন</p>
        <p style="margin:0 0 14px;">2. "Add to Home Screen" সিলেক্ট করুন</p>
        <button id="iosHintClose" style="background:#f2c94c;color:#132720;font-weight:700;border:none;border-radius:999px;padding:10px 20px;">বুঝেছি</button>
      </div>`;
    document.body.appendChild(hint);
    document.getElementById("iosHintClose").addEventListener("click", ()=>{ hint.style.display = "none"; });
  }

   
  if(isIOS){
    btn.style.display = "block";
  }
})();
