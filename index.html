<style>
:root{
  --bg:#0f241d; --bg2:#183229; --ac:#f2c94c;
  --ink:#f3efe2; --mut:rgba(243,239,226,.6); --line:rgba(243,239,226,.1); --card:rgba(243,239,226,.055);
  --good:#8fd08f; --warn:#f2c14e; --bad:#f28a8a;
  --c-ai:#c9a6f2; --c-ailab:#f2a6c5; --c-ps:#8ecbf2; --c-ca:#6fa8dc; --c-toc:#7fd9c4;
  --c-spd:#9bd67f; --c-fma:#f2c14e; --c-lpl:#f2965a; --c-cn:#f4dd6e; --c-cnlab:#e39fb5;
  --head:'Bricolage Grotesque','Hind Siliguri',system-ui,sans-serif;
  --body:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme=mon]{--bg:#0e1a33;--bg2:#16264a;--ac:#6fc7f2}
:root[data-theme=tue]{--bg:#2a121c;--bg2:#3a1a28;--ac:#f2c94c}
:root[data-theme=wed]{--bg:#1b1330;--bg2:#2a1d48;--ac:#c9a6f2}
:root[data-theme=thu]{--bg:#0b2a26;--bg2:#123d37;--ac:#7fe0c4}
:root[data-theme=fri]{--bg:#1a1c20;--bg2:#272a30;--ac:#f2c14e}
:root[data-theme=sat]{--bg:#2c1e10;--bg2:#40291a;--ac:#f2965a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:var(--body);color:var(--ink);min-height:100vh;
  background:radial-gradient(120% 50% at 50% -5%,color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%),var(--bg);
  background-attachment:fixed;transition:background-color .6s;
  padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{max-width:560px;margin:0 auto}

/* header */
.top{padding:calc(22px + env(safe-area-inset-top,0px)) 20px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-family:var(--head);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:-.5px}
.top .grp{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--mut);font-size:14px}
.chg{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;color:var(--ac)}
.clock{text-align:right;font-family:var(--head);font-weight:700}
.clock b{display:block;font-size:22px}
.clock span{font-size:13px;color:var(--mut);font-weight:500}

/* day strip */
.days{position:sticky;top:0;z-index:5;display:flex;gap:8px;padding:10px 16px 12px;overflow-x:auto;scrollbar-width:none;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  background:linear-gradient(var(--bg) 75%,transparent)}
.days::-webkit-scrollbar{display:none}
.day{flex:1 0 56px;position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 0 8px;text-align:center;transition:background .2s,color .2s}
.day small{display:block;font-size:12px;color:var(--mut)}
.day b{display:block;font-family:var(--head);font-size:20px;line-height:1.2}
.day.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.day.active{background:var(--ac);border-color:var(--ac);color:#17211c}
.day.active small{color:rgba(23,33,28,.7)}
.day.active::after{background:#17211c}

/* live banner */
.live{margin:6px 16px 0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;
  background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--ac);animation:pulse 1.8s infinite;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.live div{flex:1;min-width:0}
.live small{display:block;font-size:12.5px;color:var(--mut)}
.live b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live time{font-family:var(--head);font-weight:800;font-size:20px;color:var(--ac);font-variant-numeric:tabular-nums}

/* stats */
.stats{margin:12px 16px 0;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:var(--card)}
.stats div{padding:10px 4px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--head);font-size:19px;font-weight:700}
.stats span{font-size:12px;color:var(--mut)}

/* timeline */
.list{padding:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.empty{margin:16px;padding:48px 20px;text-align:center;border:1px dashed var(--line);border-radius:20px;color:var(--mut)}
.empty b{display:block;font-family:var(--head);font-size:22px;color:var(--ink);margin-bottom:6px}
.cls{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 12px;border-radius:18px;
  background:var(--card);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer;transition:transform .15s,background .15s}
.cls::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.cls:active{transform:scale(.985)}
.cls.now{background:color-mix(in srgb,var(--ac) 13%,var(--bg2));border-color:var(--ac)}
.cls .t{padding-left:6px;font-family:var(--head);line-height:1.25}
.cls .t b{display:block;font-size:15px;font-weight:700}
.cls .t span{font-size:12.5px;color:var(--mut);font-weight:500}
.cls h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.cls .fac{margin-top:3px;font-size:13px;color:var(--mut)}
.cls .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.note-pill{font-size:12.5px;color:var(--c-lpl);background:color-mix(in srgb,var(--c-lpl) 14%,transparent);border-radius:8px;padding:1px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room{text-align:center;min-width:52px;padding:7px 8px;border-radius:12px;background:rgba(0,0,0,.22);font-family:var(--head);font-weight:700;font-size:17px;line-height:1.1}
.room small{display:block;font-family:var(--body);font-weight:400;font-size:11px;color:var(--mut);margin-bottom:2px}
.cls.now .room{background:var(--ac);color:#17211c}
.cls.now .room small{color:rgba(23,33,28,.7)}
.brk{display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;font-size:13px;color:var(--mut)}
.brk::before,.brk::after{content:"";flex:1;border-top:1px dashed var(--line)}
/* my note */
.mynote{margin:20px 16px 0;padding:16px;border-radius:18px;background:var(--bg2);border:1px solid var(--line)}
.mynote .hd{display:flex;justify-content:space-between;align-items:center}
.mynote h2{margin:0;font-family:var(--head);font-size:16px}
.mynote p{margin:10px 0 0;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mynote .dim{color:var(--mut);font-size:14px}
textarea{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:inherit;font-size:15.5px;resize:vertical;min-height:84px}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:500}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#17211c;font-weight:600}
.btn.sm{padding:4px 12px;font-size:13px}
.foot{text-align:center;padding:28px 20px 0;font-size:13px;color:var(--mut);line-height:1.8}
.foot b{display:block;color:var(--ink);font-family:var(--head);font-size:14px}

/* bottom nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;width:min(420px,calc(100% - 24px));
  display:grid;grid-template-columns:repeat(2,1fr);padding:6px;border-radius:24px;background:color-mix(in srgb,var(--bg2) 88%,black);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.45);backdrop-filter:blur(14px)}
.nav button{position:relative;background:none;border:0;border-radius:18px;padding:8px 4px 7px;font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button i{font-style:normal;font-size:20px;line-height:1.2}
.nav button.on{color:var(--ac)}
.nav .cnt{position:absolute;top:3px;left:calc(50% + 6px);background:var(--ac);color:#17211c;border-radius:999px;font-size:11px;font-weight:700;min-width:17px;padding:0 5px;line-height:17px}
#installAppBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:19;display:none;border:0;border-radius:999px;padding:9px 18px;background:var(--ac);color:#17211c;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.4)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
.sheet-wrap.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--bg2);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-family:var(--head);font-size:24px;margin:0 0 4px;letter-spacing:-.3px}
.sheet .sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.sec{margin-top:14px;padding:14px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-family:var(--head);font-size:14px}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:4px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:6px}
.pick button{padding:20px 8px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-family:var(--head);font-weight:700;font-size:26px}
.pick button:active{background:var(--ac);color:#17211c}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.item{padding:12px 14px;margin-bottom:10px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid var(--line);cursor:pointer}
.item small{display:block;color:var(--mut);font-size:12.5px}
.item .tx{margin-top:4px;font-size:15px}
.txt-link{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:13px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:#17211c;font-size:14px;padding:9px 18px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1 id="title">Class routine</h1>
      <div class="grp"><span id="grpLine"></span><button class="chg" id="changeBtn" style="display:none">Change</button></div>
    </div>
    <div class="clock"><b id="clockT">—</b><span id="clockD"></span></div>
  </header>
  <nav class="days" id="dayNav" aria-label="Days"></nav>
  <div class="live" id="live" style="display:none"><span class="pulse"></span><div><small id="stTag"></small><b id="stName"></b></div><time id="stCd"></time></div>
  <div class="stats" id="stats" style="display:none"></div>
  <main class="list" id="board"></main>
  <section class="mynote" id="myNote"></section>
  <footer class="foot"><b>Made by Mahim Ahmed Rahim</b>CSE Department<br><span id="upd"></span></footer>

</nav>
<button id="installAppBtn">📲 Install app</button>
<div class="sheet-wrap" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

const THEME_BG={sun:"#0f241d",mon:"#0e1a33",tue:"#2a121c",wed:"#1b1330",thu:"#0b2a26",fri:"#1a1c20",sat:"#2c1e10"};

const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

const hrs=m=>(m/60).toFixed(m%60?1:0)+"h";

function applyTheme(){
  const t=THEMES[new Date().getDay()];
  if(document.documentElement.dataset.theme===t)return;
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name="theme-color"]').content=THEME_BG[t];
}
applyTheme();setInterval(applyTheme,60000);

/* sheet */
function openSheet(html,lock){$("sheetBody").innerHTML=html;$("sheet").dataset.lock=lock?"1":"";$("sheet").classList.add("open")}
function closeSheet(){$("sheet").classList.remove("open")}
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet"&&!e.currentTarget.dataset.lock)closeSheet()});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600)}

/* day strip */
function buildDays(){
  const n=new Date(),nd=n.getDay();$("dayNav").innerHTML="";
  DATA.forEach(d=>{
    const dt=new Date(n);dt.setDate(n.getDate()-(nd-d.dow));
    const b=document.createElement("button");
    b.className="day"+(d.dow===nd?" today":"");b.dataset.dow=d.dow;
    b.innerHTML=`<small>${d.full.slice(0,3)}</small><b>${dt.getDate()}</b>`;
    b.onclick=()=>{activeDow=d.dow;render()};
    $("dayNav").appendChild(b);
  });
}

function render(){
  const n=new Date(),nd=n.getDay(),nm=n.getHours()*60+n.getMinutes();
  document.querySelectorAll(".day").forEach(b=>b.classList.toggle("active",+b.dataset.dow===activeDow));
  const day=DATA.find(d=>d.dow===activeDow),board=$("board");
  visible=day.classes.map((c,i)=>({...c,_i:i})).filter(c=>!c.batch||c.batch===grp);
  $("live").style.display="none";bannerT=null;

  if(!visible.length){
    board.innerHTML=`<div class="empty"><b>No classes</b>Enjoy your ${day.full}.</div>`;
    $("stats").style.display="none";renderNote();renderCount();return;
  }
  let cur=-1,nxt=-1;
  if(day.dow===nd)visible.forEach((c,i)=>{
    if(nm>=mins(c.start)&&nm<mins(c.end))cur=i;
    if(nxt<0&&nm<mins(c.start))nxt=i;
  });
  if(cur>-1){const c=visible[cur];bannerT={type:"cur",name:SUBJECTS[c.subj].name,at:mins(c.end)}}
  else if(nxt>-1){const c=visible[nxt];bannerT={type:"next",name:SUBJECTS[c.subj].name,at:mins(c.start)}}
  if(bannerT){$("live").style.display="flex";$("stName").textContent=bannerT.name;$("stTag").textContent=bannerT.type==="cur"?"Ends in":"Next class starts in"}
  tick();

  let cm=0,free=0;
  visible.forEach((c,i)=>{cm+=mins(c.end)-mins(c.start);if(i<visible.length-1)free+=Math.max(0,mins(visible[i+1].start)-mins(c.end))});
  const span=mins(visible[visible.length-1].end)-mins(visible[0].start);
  $("stats").style.display="grid";
  $("stats").innerHTML=[[visible.length,"Classes"],[hrs(cm),"In class"],[hrs(free),"Free"],[hrs(span),"On campus"]].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");

  const notes=load(K.notes);let html="";
  visible.forEach((c,i)=>{
    const s=SUBJECTS[c.subj],nt=notes[noteKey(sec,day.dow,c._i)];
    html+=`<article class="cls${i===cur?" now":""}" data-i="${c._i}" style="--sc:${s.color}">
      <div class="t"><b>${fmt(c.start)}</b><span>to ${fmt(c.end)}</span></div>
      <div><h3>${esc(s.name)}</h3><div class="fac">${esc(c.fac)}</div>
        ${nt?`<div class="meta"><span class="note-pill">📌 ${esc(nt)}</span></div>`:""}</div>
      <div class="room"><small>Room</small>${esc(c.room)}${c.batch?`<small style="margin:2px 0 0">${c.batch}</small>`:""}</div>
    </article>`;
    const nx=visible[i+1];
    if(nx&&mins(nx.start)>mins(c.end))html+=`<div class="brk">☕ Break · ${dur(mins(nx.start)-mins(c.end))}</div>`;
  });
  board.innerHTML=html;renderNote();renderCount();
}
$("board").addEventListener("click",e=>{const r=e.target.closest(".cls");if(r)openClass(+r.dataset.i)});

/* class sheet */
function openClass(i){
  const day=DATA.find(d=>d.dow===activeDow),c=visible.find(x=>x._i===i);if(!c)return;
  const s=SUBJECTS[c.subj],key=noteKey(sec,day.dow,i),cur=load(K.notes)[key]||"";
  openSheet(`
    <h2>${esc(s.name)}</h2>
    <p class="sub">${day.full}, ${fmt(c.start)} – ${fmt(c.end)} · ${esc(c.fac)} · Room ${esc(c.room)}${c.batch?" ("+c.batch+")":""}</p>
    <div class="sec"><h4>📝 Note</h4>
      <textarea id="nIn" maxlength="60" placeholder="Class test, assignment বা যেকোনো reminder...">${esc(cur)}</textarea>
      <div class="btns"><button class="btn pri" id="nSave">Save note</button>${cur?'<button class="btn" id="nDel">Remove</button>':""}</div></div>
    <div class="btns" style="justify-content:center;margin-top:18px"><button class="btn" id="xClose">Close</button></div>`);
  const redo=()=>{render();openClass(i)};
  $("nSave").onclick=()=>{const v=$("nIn").value.trim(),n=load(K.notes);v?n[key]=v:delete n[key];save(K.notes,n);redo()};
  if($("nDel"))$("nDel").onclick=()=>{const n=load(K.notes);delete n[key];save(K.notes,n);redo()};
  $("xClose").onclick=closeSheet;
}

/* my note */
function renderNote(edit){
  const all=load(K.all),cur=all[sec]||"",el=$("myNote");
  if(edit){
    el.innerHTML=`<div class="hd"><h2>✎ My note</h2></div>
      <textarea id="mnIn" maxlength="300" placeholder="যেকোনো reminder, to-do বা যা খুশি লিখুন — সব দিনেই দেখা যাবে...">${esc(cur)}</textarea>
      <div class="btns"><button class="btn pri" id="mnS">Save</button><button class="btn" id="mnC">Cancel</button>${cur?'<button class="btn" id="mnD">Remove</button>':""}</div>`;
    $("mnIn").focus();
    $("mnS").onclick=()=>{const v=$("mnIn").value.trim(),a=load(K.all);v?a[sec]=v:delete a[sec];save(K.all,a);renderNote();renderCount()};
    $("mnC").onclick=()=>renderNote();
    if($("mnD"))$("mnD").onclick=()=>{const a=load(K.all);delete a[sec];save(K.all,a);renderNote();renderCount()};
    return;
  }
  el.innerHTML=`<div class="hd"><h2>📝 My note</h2><button class="btn sm" id="mnE">${cur?"Edit":"Add note"}</button></div>
    ${cur?`<p>${esc(cur)}</p>`:`<p class="dim">কোনো নোট নেই। ক্লাসের বাইরে যেকোনো reminder বা to-do এখানে লিখে রাখো — সব দিনেই দেখা যাবে।</p>`}`;
  $("mnE").onclick=()=>renderNote(true);
}

/* notes overview */
function allNotes(){
  const notes=load(K.notes),ov=load(K.all)[sec],list=[];
  if(ov)list.push({day:"My note",sub:"All days",text:ov});
  DATA.forEach(d=>d.classes.forEach((c,i)=>{
    if(c.batch&&c.batch!==grp)return;
    const t=notes[noteKey(sec,d.dow,i)];
    if(t)list.push({dow:d.dow,day:d.full,sub:SUBJECTS[c.subj].name,text:t,idx:i});
  }));
  return list;
}
function renderCount(){const n=allNotes().length,c=$("cnt");c.textContent=n;c.style.display=n?"":"none"}
function showNotes(){
  const l=allNotes();
  openSheet(`<h2>All notes</h2><p class="sub">Every class note and reminder in one place.</p>
    ${l.length?l.map(n=>`<div class="item" ${n.dow!==undefined?`data-dow="${n.dow}" data-idx="${n.idx}"`:""}><small>${esc(n.day)} · ${esc(n.sub)}</small><div class="tx">📌 ${esc(n.text)}</div></div>`).join("")
      :`<div class="sub">কোনো নোট নেই। কোনো ক্লাসে ট্যাপ করে নোট যোগ করুন।</div>`}
    <div class="btns" style="justify-content:center"><button class="btn" id="xClose">Close</button></div>`);
  $("xClose").onclick=closeSheet;
  document.querySelectorAll("#sheetBody .item[data-dow]").forEach(it=>it.onclick=()=>{
    closeSheet();activeDow=+it.dataset.dow;render();openClass(+it.dataset.idx);
  });
}

/* countdown + reminders */
function tick(){
  if(!bannerT)return;
  const n=new Date(),diff=Math.max(0,bannerT.at*60-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds()));
  $("stCd").textContent=`${Math.floor(diff/60)}:${String(diff%60).padStart(2,"0")}`;
  if(notifyOn&&bannerT.type==="next"&&diff<=300&&diff>0){
    const k=`${sec}-${activeDow}-${bannerT.name}-${bannerT.at}`;if(fired.has(k))return;fired.add(k);
    const body=`${bannerT.name} starts at ${fmt([Math.floor(bannerT.at/60),bannerT.at%60])}`;
    if("Notification" in window&&Notification.permission==="granted")new Notification("Class starting soon",{body,icon:"icon-192.png"});
    else toast("⏰ "+body);
  }
}
setInterval(tick,1000);
$("bRemind").classList.toggle("on",notifyOn);
$("bRemind").onclick=async()=>{
  if(!notifyOn){
    if("Notification" in window&&Notification.permission!=="granted"){try{await Notification.requestPermission()}catch(e){}}
    notifyOn=true;localStorage.setItem(K.not,"1");toast("🔔 You'll be reminded 5 min before class");
  }else{notifyOn=false;localStorage.setItem(K.not,"0");toast("🔕 Reminders off")}
  $("bRemind").classList.toggle("on",notifyOn);
};
$("bNotes").onclick=showNotes;

/* swipe between days */
(function(){
  let x0=null,y0=null;const b=$("board");
  b.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  b.addEventListener("touchend",e=>{
    if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;
    if(Math.abs(dx)<55||Math.abs(dx)<Math.abs(dy)*1.4)return;
    const i=DATA.findIndex(d=>d.dow===activeDow),j=dx<0?i+1:i-1;
    if(DATA[j]){activeDow=DATA[j].dow;render()}
  },{passive:true});
})();

/* clock */
function tickClock(){
  const d=new Date();$("clockT").textContent=fmt([d.getHours(),d.getMinutes()]);
  $("clockD").textContent=d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
}
tickClock();setInterval(tickClock,15000);
setInterval(()=>{if(sec)render()},30000);
$("upd").textContent=`Routine updated ${LAST_UPDATED_DATE}, ${LAST_UPDATED_TIME}`;

/* section + group picker */
function start(s,g){
  sec=s;grp=g;DATA=SECTIONS[s].days;
  $("title").textContent=`Section ${s}`;
  $("grpLine").textContent=`Group ${g}`;$("changeBtn").style.display="";
  const nd=new Date().getDay();activeDow=DATA.some(d=>d.dow===nd)?nd:DATA[0].dow;
  closeSheet();buildDays();render();
}
function pickGroup(s){
  openSheet(`<h2>Choose your group</h2><p class="sub">Section ${s} splits into ${SECTIONS[s].groups.join(" / ")} for lab classes.</p>
    <div class="pick">${SECTIONS[s].groups.map(g=>`<button data-g="${g}">${g}</button>`).join("")}</div>
    <div class="btns" style="justify-content:center"><button class="btn" id="back">Back</button></div>`,true);
  document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{localStorage.setItem(K.sec,s);localStorage.setItem(K.grp,b.dataset.g);start(s,b.dataset.g)});
  $("back").onclick=pickSection;
}
function pickSection(){
  openSheet(`<h2>Choose your section</h2><p class="sub">Saved on this device, change it anytime.</p>
    <div class="pick">${Object.keys(SECTIONS).map(s=>`<button data-s="${s}">${s}</button>`).join("")}</div>`,true);
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>pickGroup(b.dataset.s));
}
$("changeBtn").onclick=pickSection;

const sS=localStorage.getItem(K.sec),sG=localStorage.getItem(K.grp);
if(sS&&SECTIONS[sS]&&sG&&SECTIONS[sS].groups.includes(sG))start(sS,sG);else pickSection();

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

/* install button */
(function(){
  if(matchMedia("(display-mode: standalone)").matches||navigator.standalone===true)return;
  const btn=$("installAppBtn"),ios=/iphone|ipad|ipod/i.test(navigator.userAgent);let dp=null;
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;btn.style.display="block"});
  addEventListener("appinstalled",()=>btn.style.display="none");
  btn.onclick=async()=>{
    if(dp){dp.prompt();await dp.userChoice;dp=null;btn.style.display="none"}
    else if(ios)openSheet(`<h2>Install করুন</h2><p class="sub">1. নিচের Share বাটনে (⬆️) ট্যাপ করুন<br>2. "Add to Home Screen" সিলেক্ট করুন</p><div class="btns" style="justify-content:center"><button class="btn pri" id="xClose">বুঝেছি</button></div>`),$("xClose").onclick=closeSheet;
  };
  if(ios)btn.style.display="block";
})();
</script>
</body>
</html>
