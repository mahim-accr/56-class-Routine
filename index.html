<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Class Routine</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="theme-color" content="#1c3a30">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Kalam:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()">
<style>
  :root{
    --board-bg:#1c3a30;
    --board-bg-2:#20443a;
    --amber:#f2c94c;
    --amber-dim:#8a7a3f;
    --paper:#f4f1e4;
    --ink:#132720;
    --line:rgba(244,241,228,0.22);
    --off-day:#7fa596;

    --c-ai:#c9a6f2;
    --c-ailab:#f2a6c5;
    --c-ps:#8ecbf2;
    --c-ca:#6fa8dc;
    --c-toc:#7fd9c4;
    --c-spd:#9bd67f;
    --c-fma:#f2c14e;
    --c-lpl:#f2965a;
    --c-cn:#f4dd6e;
    --c-cnlab:#e39fb5;
  }

   
  :root[data-theme="sun"]{  
    --board-bg:#1c3a30; --board-bg-2:#20443a; --amber:#f2c94c; --amber-dim:#8a7a3f; --off-day:#7fa596;
  }
  :root[data-theme="mon"]{  
    --board-bg:#182849; --board-bg-2:#1d3157; --amber:#6fc7f2; --amber-dim:#4f7a8a; --off-day:#7f9bc9;
  }
  :root[data-theme="tue"]{  
    --board-bg:#3a1c28; --board-bg-2:#44202f; --amber:#f2c94c; --amber-dim:#8a6f3f; --off-day:#c98aa0;
  }
  :root[data-theme="wed"]{  
    --board-bg:#271c3a; --board-bg-2:#2f2144; --amber:#c9a6f2; --amber-dim:#7a638a; --off-day:#a695c9;
  }
  :root[data-theme="thu"]{  
    --board-bg:#123a35; --board-bg-2:#15453f; --amber:#7fe0c4; --amber-dim:#4f8a7a; --off-day:#7fc9ba;
  }
  :root[data-theme="fri"]{  
    --board-bg:#24262b; --board-bg-2:#2c2f35; --amber:#f2c14e; --amber-dim:#8a7d4f; --off-day:#9aa0a6;
  }
  :root[data-theme="sat"]{  
    --board-bg:#3a2a18; --board-bg-2:#44321d; --amber:#f2965a; --amber-dim:#8a6a4f; --off-day:#c9ab7f;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--board-bg);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:48px;
    position:relative;
    overflow-x:hidden;
    transition:background-color .8s ease, color .8s ease;
  }

  /* ---------- chalkboard atmosphere: smudges + drifting dust ---------- */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 55% 30% at 10% 5%, rgba(244,241,228,0.05), transparent 60%),
      radial-gradient(ellipse 40% 25% at 95% 0%, rgba(244,241,228,0.04), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(0,0,0,0.18), transparent 65%);
  }
  body::after{
    content:"";
    position:fixed;
    inset:-10% -10%;
    z-index:0;
    pointer-events:none;
    opacity:.5;
    background-image:
      radial-gradient(rgba(244,241,228,0.5) 1px, transparent 1.4px),
      radial-gradient(rgba(244,241,228,0.35) 1px, transparent 1.4px);
    background-size:140px 140px, 210px 210px;
    background-position:0 0, 60px 90px;
    animation:dustDrift 22s linear infinite;
  }
  @keyframes dustDrift{
    0%{ background-position:0 0, 60px 90px; }
    100%{ background-position:40px 260px, 100px 350px; }
  }
  .board-frame{ position:relative; z-index:1; transition:background-color .8s ease; }
  .select-overlay{ z-index:50; }

  .board-frame{
    max-width:640px;
    margin:0 auto;
    padding:0 0 24px;
  }

  header.hero{
    padding:30px 20px 20px;
    border-bottom:2px dashed rgba(244,241,228,0.28);
    background:var(--board-bg-2);
    position:relative;
    overflow:hidden;
    transition:background-color .8s ease, border-color .8s ease;
  }
  header.hero::before{
    content:"UNIVERSITY TIMETABLE SYSTEM";
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:3px;
    color:var(--off-day);
    margin-bottom:8px;
    animation:fadeSlideUp .5s ease both;
  }
  h1{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:clamp(30px,7.4vw,42px);
    margin:0 0 4px;
    letter-spacing:0.2px;
    line-height:1.08;
    color:var(--paper);
    transform:rotate(-0.6deg);
    animation:fadeSlideUp .55s ease both .06s;
    position:relative;
    display:inline-block;
  }
  h1 span{
    color:var(--amber);
    position:relative;
    display:inline-block;
  }
  h1 span::after{
    content:"";
    position:absolute;
    left:-2%; right:-2%; bottom:-6px;
    height:10px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 14'><path d='M2 8 Q 12 2, 22 8 T 42 8 T 62 8 T 82 8 T 102 8 T 122 8' fill='none' stroke='%23f2c94c' stroke-width='3.4' stroke-linecap='round'/></svg>");
    background-repeat:repeat-x;
    background-size:60px 10px;
    clip-path:inset(0 100% 0 0);
    animation:chalkDraw .7s ease forwards .5s;
  }
  @keyframes chalkDraw{
    0%{ clip-path:inset(0 100% 0 0); }
    100%{ clip-path:inset(0 0% 0 0); }
  }
  .subhead{
    font-family:'Space Mono',monospace;
    font-size:12px;
    color:var(--off-day);
    letter-spacing:1px;
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    flex-wrap:wrap;
    gap:6px;
    animation:fadeSlideUp .55s ease both .16s;
  }
  .subhead b{color:var(--amber); font-weight:700;}

  @keyframes fadeSlideUp{
    0%{ opacity:0; transform:translateY(8px); }
    100%{ opacity:1; transform:translateY(0); }
  }

  .section-badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--amber);
    background:rgba(244,241,228,0.05);
    border:2px dashed var(--amber-dim);
    padding:5px 12px;
    border-radius:14px 4px 14px 4px;
    animation:fadeSlideUp .5s ease both;
    transition:border-color .2s ease, background .2s ease;
  }
  .section-badge:hover{
    border-color:var(--amber);
    background:rgba(244,241,228,0.09);
  }
  .section-badge button{
    border:none;
    background:none;
    color:var(--off-day);
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:1px;
    cursor:pointer;
    padding:0;
    text-decoration:underline;
    text-decoration-style:dashed;
  }

  nav.days{
    display:flex;
    overflow-x:auto;
    background:var(--board-bg-2);
    border-bottom:2px dashed rgba(244,241,228,0.2);
    position:sticky;
    top:0;
    z-index:5;
    scrollbar-width:none;
    padding-top:4px;
    transition:background-color .8s ease, border-color .8s ease;
  }
  nav.days::-webkit-scrollbar{display:none;}
  nav.days button{
    flex:1 0 auto;
    min-width:76px;
    background:none;
    border:none;
    color:var(--off-day);
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    padding:14px 10px 12px;
    cursor:pointer;
    position:relative;
    transition:color .2s ease;
  }
  nav.days button:hover{color:var(--paper);}
  nav.days button .full{display:block; font-family:'Kalam',cursive; font-weight:700; font-size:15px; letter-spacing:0; margin-top:2px; color:inherit;}
  nav.days button.active{color:var(--amber);}
  nav.days button.active::before{
    content:"";
    position:absolute;
    left:6%; right:6%; bottom:4px; top:2px;
    border:2.5px solid var(--amber);
    border-radius:52% 48% 47% 53% / 58% 44% 56% 42%;
    transform:rotate(-2deg);
    opacity:0;
    animation:chalkLoop .5s ease forwards;
    pointer-events:none;
  }
  @keyframes chalkLoop{
    0%{ opacity:0; transform:rotate(-6deg) scale(.85); }
    60%{ opacity:1; transform:rotate(1deg) scale(1.03); }
    100%{ opacity:1; transform:rotate(-2deg) scale(1); }
  }
  nav.days button .dot{
    display:none;
    width:6px;height:6px;border-radius:50%;background:var(--amber);
    position:absolute; top:6px; right:16px;
    animation:blink 1.4s infinite;
  }
  nav.days button.is-today .dot{display:block;}

  .board{padding:16px 16px 4px;}

  .empty-day{
    font-family:'Space Mono',monospace;
    color:var(--off-day);
    text-align:center;
    padding:60px 20px;
    font-size:14px;
    letter-spacing:2px;
    border:2px dashed rgba(244,241,228,0.22);
    border-radius:16px 6px 16px 6px;
    margin-top:8px;
  }
  .empty-day .big{
    display:block;
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:24px;
    color:var(--paper);
    letter-spacing:0.5px;
    margin-bottom:10px;
    transform:rotate(-1deg);
  }

  .row{
    display:grid;
    grid-template-columns:78px 1fr 62px;
    gap:12px;
    align-items:center;
    padding:14px 10px;
    border-bottom:2px dashed rgba(244,241,228,0.14);
    position:relative;
    border-radius:6px;
    transition:background .2s ease, transform .2s ease;
  }
  .row:nth-child(odd){ transform:rotate(-0.15deg); }
  .row:nth-child(even){ transform:rotate(0.15deg); }
  .row:last-child{border-bottom:none;}
  .row:hover{background:rgba(244,241,228,0.04); transform:translateX(2px) rotate(0deg);}

  .row.now{
    animation:flipIn .38s ease both;
    background:rgba(242,201,76,0.07);
    border-radius:10px;
    box-shadow:0 0 0 2px transparent;
  }
  .row.now::before{
    content:"";
    position:absolute;
    inset:2px;
    border:2.5px dashed var(--amber);
    border-radius:14px 6px 14px 6px;
    opacity:.85;
    animation:chalkWobble 3.4s ease-in-out infinite;
    pointer-events:none;
  }
  .row.now::after{
    content:"★";
    position:absolute;
    top:-9px; right:6px;
    font-size:13px;
    color:var(--amber);
    transform:rotate(-8deg);
  }
  @keyframes chalkWobble{
    0%,100%{ transform:rotate(-0.4deg) scale(1); opacity:.8; }
    50%{ transform:rotate(0.4deg) scale(1.004); opacity:1; }
  }

  .time{
    font-family:'Space Mono',monospace;
    font-size:12.5px;
    line-height:1.35;
    color:#c7d6cd;
    letter-spacing:0.5px;
  }
  .row.now .time{color:var(--amber);}

  .seq{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--off-day);
    display:block;
    margin-bottom:3px;
  }

  .subject-wrap{min-width:0;}
  .chip{
    display:inline-block;
    position:relative;
    overflow:hidden;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:12.5px;
    letter-spacing:0.1px;
    color:var(--ink);
    padding:5px 11px;
    border-radius:12px 4px 12px 4px;
    line-height:1.2;
    max-width:100%;
    box-shadow:0 2px 6px -2px rgba(0,0,0,0.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .row:hover .chip{ transform:translateY(-1px) rotate(-0.6deg); box-shadow:0 4px 10px -2px rgba(0,0,0,0.4); }
  .chip::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.35) 48%, transparent 65%);
    transform:translateX(-120%);
  }
  .row.now .chip::after{ animation:chipSheen 3.2s ease-in-out infinite; }
  @keyframes chipSheen{
    0%{ transform:translateX(-120%); }
    35%,100%{ transform:translateX(120%); }
  }
  .faculty{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    color:var(--off-day);
    margin-top:6px;
    letter-spacing:1px;
  }

  .gate{
    font-family:'Space Mono',monospace;
    text-align:right;
  }
  .gate .lbl{display:block; font-size:8.5px; color:var(--off-day); letter-spacing:1.5px; margin-bottom:2px;}
  .gate .num{
    font-size:14px;
    font-weight:700;
    color:var(--paper);
    border:2px dashed rgba(244,241,228,0.3);
    border-radius:8px 3px 8px 3px;
    padding:3px 7px;
    display:inline-block;
  }
  .row.now .gate .num{border-color:var(--amber); color:var(--amber); border-style:solid;}

  /* ---------- break time row ---------- */
  .row.break{
    opacity:.72;
    padding:10px 10px;
  }
  .row.break:hover{ transform:none; background:none; }
  .row.break .time{color:var(--off-day);}
  .break-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--off-day);
    padding:5px 11px;
    border:2px dashed rgba(244,241,228,0.22);
    border-radius:12px 4px 12px 4px;
  }

  /* ---------- test / note badge + button ---------- */
  .row.has-note{
    background:rgba(242,148,90,0.06);
  }
  .row.has-note::before{
    content:"";
    position:absolute;
    left:0; top:8px; bottom:8px;
    width:3px;
    background:var(--c-lpl, #f2965a);
    border-radius:2px;
  }
  .note-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Space Mono',monospace;
    font-weight:700;
    font-size:10px;
    letter-spacing:1px;
    color:#f2965a;
    margin-top:6px;
    padding:2px 8px;
    border:1.5px dashed rgba(242,150,90,0.55);
    border-radius:8px 3px 8px 3px;
  }
  .note-btn{
    display:inline-block;
    margin-top:6px;
    background:none;
    border:none;
    padding:0;
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    letter-spacing:1px;
    color:var(--off-day);
    text-decoration:underline;
    text-decoration-style:dashed;
    cursor:pointer;
  }
  .note-btn:hover{color:var(--amber);}

  .select-card input[type="text"]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:2px dashed rgba(244,241,228,0.35);
    color:var(--paper);
    font-family:'Kalam',cursive;
    font-size:20px;
    text-align:center;
    padding:8px 4px 12px;
    outline:none;
    transition:border-color .18s ease;
  }
  .select-card input[type="text"]:focus{border-color:var(--amber);}
  .select-card input[type="text"]::placeholder{color:var(--off-day); opacity:.6;}
  .select-options.note-actions button{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:1px;
    padding:14px 8px;
  }

  .status-banner{
    margin:14px 16px 0;
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:1px;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    background:rgba(242,201,76,0.08);
    border:2px dashed var(--amber-dim);
    border-radius:10px 3px 10px 3px;
    animation:fadeSlideUp .4s ease both;
  }
  .status-banner .blink{
    width:6px;height:6px;border-radius:50%;background:var(--amber);
    box-shadow:0 0 8px rgba(242,201,76,0.7);
    animation:blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}

  footer.note{
    text-align:center;
    padding:28px 20px 0;
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--off-day);
    letter-spacing:1.5px;
    line-height:2.1;
    animation:fadeSlideUp .6s ease both .1s;
  }
  footer.note b{
    display:block;
    font-family:'Kalam',cursive;
    color:var(--amber);
    font-size:14px;
    letter-spacing:0.5px;
    font-weight:700;
  }

  .update-tag{
    display:block;
    margin-top:14px;
    padding-top:10px;
    border-top:1px dashed rgba(244,241,228,0.16);
    font-family:'Space Mono',monospace;
    font-size:9.5px;
    color:var(--off-day);
    letter-spacing:1.2px;
  }
  .update-tag .ver{color:var(--amber-dim); font-weight:700;}
  .update-tag .lbl2{color:var(--off-day);}

  /* flip-in animation when switching days */
  @keyframes flipIn{
    0%{ transform:rotateX(90deg); opacity:0; }
    60%{ transform:rotateX(-8deg); opacity:1; }
    100%{ transform:rotateX(0); opacity:1; }
  }
  .row, .empty-day{
    transform-origin:top center;
    animation:flipIn .38s ease both;
  }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:0.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:0.001ms !important;
    }
    body::before, body::after{display:none;}
  }

   
  .select-overlay{
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(242,201,76,0.07), transparent 65%),
      var(--board-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
    animation:overlayFade .3s ease both;
  }
  @keyframes overlayFade{ 0%{opacity:0;} 100%{opacity:1;} }
  .select-card{
    max-width:380px;
    width:100%;
    text-align:center;
    animation:cardRise .45s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes cardRise{
    0%{ opacity:0; transform:translateY(18px) scale(.98); }
    100%{ opacity:1; transform:translateY(0) scale(1); }
  }
  .select-card .kicker{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:3px;
    color:var(--amber-dim);
    margin-bottom:12px;
  }
  .select-card h2{
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:28px;
    margin:0 0 8px;
    color:var(--paper);
    transform:rotate(-0.5deg);
  }
  .select-card p{
    font-family:'Space Mono',monospace;
    font-size:11.5px;
    color:var(--off-day);
    line-height:1.7;
    margin:0 0 30px;
    letter-spacing:0.5px;
  }
  .select-options{
    display:flex;
    gap:14px;
  }
  .select-options.three button{font-size:20px;}
  .select-options button{
    flex:1;
    padding:24px 8px;
    border-radius:16px 6px 16px 6px;
    border:2.5px dashed rgba(244,241,228,0.3);
    background:var(--board-bg-2);
    font-family:'Kalam',cursive;
    font-weight:700;
    font-size:28px;
    color:var(--paper);
    cursor:pointer;
    transition:border-color .18s ease, color .18s ease, transform .18s ease, background .18s ease;
    animation:fadeSlideUp .4s ease both;
  }
  .select-options button:nth-child(1){animation-delay:.04s;}
  .select-options button:nth-child(2){animation-delay:.1s;}
  .select-options button:nth-child(3){animation-delay:.16s;}
  .select-options button:hover,
  .select-options button:active{
    border-color:var(--amber);
    border-style:solid;
    color:var(--amber);
    background:rgba(242,201,76,0.08);
    transform:translateY(-3px) rotate(-0.8deg);
  }
  .select-options .tag{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:9px;
    letter-spacing:1.5px;
    color:var(--off-day);
    margin-top:6px;
  }
  #installAppBtn{
    animation:installPulse 2.4s ease-in-out infinite;
    transition:transform .15s ease;
  }
  #installAppBtn:hover{ transform:translateX(-50%) scale(1.04); }
  @keyframes installPulse{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 0 rgba(242,201,76,0); }
    50%{ box-shadow:0 6px 18px rgba(0,0,0,.4), 0 0 16px rgba(242,201,76,0.55); }
  }

  .back-link{
    display:inline-block;
    margin-top:22px;
    font-family:'Space Mono',monospace;
    font-size:10.5px;
    letter-spacing:1px;
    color:var(--off-day);
    text-decoration:underline;
    text-decoration-style:dashed;
    cursor:pointer;
    background:none;
    border:none;
  }

  /* ---------- header icon toolbar ---------- */
  .icon-toolbar{
    display:flex;
    gap:8px;
    margin-top:14px;
    animation:fadeSlideUp .5s ease both .1s;
  }
  .icon-btn{
    position:relative;
    display:inline-flex;
    align-items:center;

function fmt(t){
  let [h,m] = t;
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if(h12===0) h12=12;
  return `${h12}:${m.toString().padStart(2,"0")} ${ap}`;
}

/* ---------- attendance storage ---------- */
function loadAttendance(){
  try{ return JSON.parse(localStorage.getItem(ATTEND_KEY) || "{}"); }
  catch(e){ return {}; }
}
function saveAttendance(a){
  localStorage.setItem(ATTEND_KEY, JSON.stringify(a));
}
function attendFor(section, subj){
  const all = loadAttendance();
  return (all[section] && all[section][subj]) || {present:0, total:0};
}
function markAttendance(subj, status){
  const all = loadAttendance();
  if(!all[currentSection]) all[currentSection] = {};
  if(!all[currentSection][subj]) all[currentSection][subj] = {present:0, total:0};
  all[currentSection][subj].total++;
  if(status === "present") all[currentSection][subj].present++;
  saveAttendance(all);
}
function resetAttendance(subj){
  const all = loadAttendance();
  if(all[currentSection]) delete all[currentSection][subj];
  saveAttendance(all);
}
function attendBadgeHtml(subj){
  const a = attendFor(currentSection, subj);
  if(a.total === 0) return `<span class="attend-badge">no data yet</span>`;
  const pct = Math.round((a.present/a.total)*100);
  const cls = pct>=80 ? "good" : pct>=70 ? "warn" : "bad";
  return `<span class="attend-badge ${cls}">${pct}% (${a.present}/${a.total})</span>`;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[m]));
}

function renderUpdateTag(){
  const tag = document.getElementById("updateTag");
  if(!tag) return;
  tag.innerHTML = `<span class="lbl2">Routine Last Updated:</span> <span class="ver">${LAST_UPDATED_DATE}</span> <span class="lbl2">at</span> <span class="ver">${LAST_UPDATED_TIME}</span>`;
}
renderUpdateTag();

function buildDayNav(){
  dayNav.innerHTML = "";
  DATA.forEach(d=>{
    const btn = document.createElement("button");
    btn.dataset.dow = d.dow;
    btn.innerHTML = `${d.label}<span class="full">${d.full.slice(0,3)}</span><span class="dot"></span>`;
    if(d.dow===nowDow) btn.classList.add("is-today");
    btn.addEventListener("click", ()=>{ activeDow = d.dow; render(); });
    dayNav.appendChild(btn);
  });
}

function render(){
  document.querySelectorAll("nav.days button").forEach(b=>{
    b.classList.toggle("active", parseInt(b.dataset.dow)===activeDow);
  });

  const day = DATA.find(d=>d.dow===activeDow);
  const board = document.getElementById("board");
  board.innerHTML = "";

  const banner = document.getElementById("statusBanner");
  const statusText = document.getElementById("statusText");
  banner.style.display = "none";
  const statsStrip = document.getElementById("statsStrip");
  bannerTarget = null;

  const visibleClasses = day.classes
    .map((c, idx) => ({...c, _idx: idx}))
    .filter(c => !c.batch || c.batch === currentGroup);

  lastVisibleClasses = visibleClasses;

  if(visibleClasses.length === 0){
    board.innerHTML = `<div class="empty-day"><span class="big">NO CLASSES</span>Enjoy your ${day.full}.</div>`;
    statsStrip.style.display = "none";
    renderDayNote();
    renderPinnedCount();
    renderRadar();
    return;
  }

  let currentIdx = -1, nextIdx = -1;
  if(day.dow === nowDow){
    visibleClasses.forEach((c,i)=>{
      const s = minutes(c.start), e = minutes(c.end);
      if(nowMin >= s && nowMin < e) currentIdx = i;
      if(nextIdx === -1 && nowMin < s) nextIdx = i;
    });
  }

  if(currentIdx > -1){
    const c = visibleClasses[currentIdx];
    banner.style.display = "flex";
    bannerTarget = {type:"current", label:SUBJECTS[c.subj].name.toUpperCase(), untilMin:minutes(c.end)};
    statusText.innerHTML = `IN PROGRESS · ${SUBJECTS[c.subj].name.toUpperCase()} ENDS ${fmt(c.end)}`;
  } else if(nextIdx > -1){
    const c = visibleClasses[nextIdx];
    banner.style.display = "flex";
    bannerTarget = {type:"next", label:SUBJECTS[c.subj].name.toUpperCase(), untilMin:minutes(c.start)};
    statusText.innerHTML = `NEXT UP · ${SUBJECTS[c.subj].name.toUpperCase()} AT ${fmt(c.start)}`;
  }
  tickCountdown();

  /* ---- today's stats: class count / total hours / free time ---- */
  let totalClassMin = 0;
  visibleClasses.forEach(c => totalClassMin += minutes(c.end) - minutes(c.start));
  let freeMin = 0;
  visibleClasses.forEach((c,i)=>{
    if(i < visibleClasses.length - 1){
      const gap = minutes(visibleClasses[i+1].start) - minutes(c.end);
      if(gap > 0) freeMin += gap;
    }
  });
  const span = minutes(visibleClasses[visibleClasses.length-1].end) - minutes(visibleClasses[0].start);
  const fmtHrs = m => (m/60).toFixed(m % 60 === 0 ? 0 : 1);
  statsStrip.style.display = "flex";
  statsStrip.innerHTML = `
    <div class="stat-pill"><span class="n">${visibleClasses.length}</span><span class="l">CLASSES</span></div>
    <div class="stat-pill"><span class="n">${fmtHrs(totalClassMin)}h</span><span class="l">CLASS TIME</span></div>
    <div class="stat-pill"><span class="n">${freeMin > 0 ? fmtHrs(freeMin)+"h" : "0h"}</span><span class="l">FREE GAPS</span></div>
    <div class="stat-pill"><span class="n">${fmtHrs(span)}h</span><span class="l">CAMPUS SPAN</span></div>
  `;

  const notes = loadNotes();

  /* build a display list that interleaves BREAK TIME rows into any
     gap between two consecutive classes */
  const items = [];
  visibleClasses.forEach((c,i)=>{
    items.push({type:"class", data:c, seq:i});
    if(i < visibleClasses.length - 1){
      const gapStart = minutes(c.end);
      const gapEnd = minutes(visibleClasses[i+1].start);
      if(gapEnd > gapStart){
        items.push({type:"break", start:c.end, end:visibleClasses[i+1].start});
      }
    }
  });

  items.forEach((item, rowI)=>{
    const row = document.createElement("div");
    row.style.animationDelay = (rowI*0.045)+"s";

    if(item.type === "break"){
      row.className = "row break";
      row.innerHTML = `
        <div class="time">${fmt(item.start)}<br>– ${fmt(item.end)}</div>
        <div class="subject-wrap"><span class="break-chip">☕ BREAK TIME</span></div>
        <div class="gate"></div>
      `;
      board.appendChild(row);
      return;
    }

    const c = item.data;
    const i = item.seq;
    const subj = SUBJECTS[c.subj];
    const note = notes[noteKey(currentSection, day.dow, c._idx)];

    row.className = "row" + (i===currentIdx ? " now" : "") + (note ? " has-note" : "");
    row.innerHTML = `
      <div class="time"><span class="seq">${(i+1).toString().padStart(2,"0")}</span>${fmt(c.start)}<br>– ${fmt(c.end)}</div>
      <div class="subject-wrap">
        <span class="chip" style="background:${subj.color}">${subj.name}</span>
        <span class="faculty">${c.fac}</span>
        <div class="attend-row">
          ${attendBadgeHtml(c.subj)}
          <button class="attend-btn p" data-subj="${c.subj}">✓ present</button>
          <button class="attend-btn a" data-subj="${c.subj}">✕ absent</button>
        </div>
        ${note ? `<span class="note-badge">📌 ${escapeHtml(note)}</span>` : ""}
        <button class="note-btn" data-idx="${c._idx}">${note ? "✎ edit note" : "+ add note"}</button>
      </div>
      <div class="gate"><span class="lbl">ROOM</span><span class="num">${c.room}${c.batch ? " " + c.batch : ""}</span></div>
    `;
    board.appendChild(row);
  });

  renderDayNote();
  renderPinnedCount();
  renderRadar();
}

/* =========================================================
   DAY NOTE — a general note for the whole day, independent
   of any single class. Saved per section + day, on-device.
   ========================================================= */
function renderDayNote(editing){
  const section = document.getElementById("dayNoteSection");
  if(!section || !DATA) return;
  const day = DATA.find(d=>d.dow===activeDow);
  const key = dayNoteKey(currentSection, day.dow);
  const dayNotes = loadDayNotes();
  const existing = dayNotes[key] || "";

  if(editing){
    section.innerHTML = `
      <div class="dn-head"><span class="dn-title">✎ DAY NOTE · ${day.full.toUpperCase()}</span></div>
      <textarea id="dnInput" maxlength="200" placeholder="আজকের জন্য যেকোনো reminder, class test, বা to-do লিখুন...">${escapeHtml(existing)}</textarea>
      <div class="dn-actions">
        <button id="dnSaveBtn">SAVE</button>
        <button id="dnCancelBtn">CANCEL</button>
        ${existing ? '<button id="dnDeleteBtn">REMOVE</button>' : ""}
      </div>
    `;
    const input = document.getElementById("dnInput");
    input.focus();
    document.getElementById("dnSaveBtn").addEventListener("click", ()=>{
      const val = input.value.trim();
      const dn = loadDayNotes();
      if(val){ dn[key] = val; } else { delete dn[key]; }
      saveDayNotes(dn);
      renderDayNote(false);
      renderPinnedCount();
    });
    document.getElementById("dnCancelBtn").addEventListener("click", ()=> renderDayNote(false));
    const delBtn = document.getElementById("dnDeleteBtn");
    if(delBtn){
      delBtn.addEventListener("click", ()=>{
        const dn = loadDayNotes();
        delete dn[key];
        saveDayNotes(dn);
        renderDayNote(false);
        renderPinnedCount();
      });
    }
    return;
  }

  section.innerHTML = `
    <div class="dn-head">
      <span class="dn-title">📝 DAY NOTE · ${day.full.toUpperCase()}</span>
      <button class="dn-edit-btn" id="dnEditBtn">${existing ? "✎ edit" : "+ add note"}</button>
    </div>
    ${existing
      ? `<div class="dn-text">${escapeHtml(existing)}</div>`
      : `<div class="dn-empty">এই দিনের জন্য কোনো সাধারণ নোট নেই। ক্লাসের বাইরের কোনো reminder থাকলে এখানে যোগ করুন।</div>`}
  `;
  document.getElementById("dnEditBtn").addEventListener("click", ()=> renderDayNote(true));
}

/* =========================================================
   PINNED NOTES OVERVIEW — every class-note and day-note
   across the whole week, in one place.
   ========================================================= */
function collectAllNotes(){
  const notes = loadNotes();
  const dayNotes = loadDayNotes();
  const list = [];
  if(DATA){
    DATA.forEach(d=>{
      const dnKey = dayNoteKey(currentSection, d.dow);
      if(dayNotes[dnKey]){
        list.push({dow:d.dow, dayLabel:d.full, sub:"General day note", text:dayNotes[dnKey]});
      }
      d.classes.forEach((c, idx)=>{
        if(c.batch && c.batch !== currentGroup) return;
        const nKey = noteKey(currentSection, d.dow, idx);
        if(notes[nKey]){
          list.push({dow:d.dow, dayLabel:d.full, sub:SUBJECTS[c.subj].name, text:notes[nKey]});
        }
      });
    });
  }
  return list;
}

function renderPinnedCount(){
  const el = document.getElementById("pinnedCount");
  if(!el) return;
  el.textContent = collectAllNotes().length;
}

function showPinnedOverview(){

/* =========================================================
   EXAM / TEST RADAR — scans all notes for test/exam keywords
   and surfaces the nearest upcoming one.
   ========================================================= */
const RADAR_KEYWORDS = /test|exam|quiz|viva|ct\b|পরীক্ষা|টেস্ট|কুইজ/i;

function renderRadar(){
  const strip = document.getElementById("radarStrip");
  if(!strip) return;
  const notes = collectAllNotes().filter(n => RADAR_KEYWORDS.test(n.text));
  if(notes.length === 0){ strip.innerHTML = ""; return; }

  notes.forEach(n => { n.daysUntil = (n.dow - nowDow + 7) % 7; });
  notes.sort((a,b)=> a.daysUntil - b.daysUntil);
  const soonest = notes[0];
  const when = soonest.daysUntil === 0 ? "TODAY" : soonest.daysUntil === 1 ? "TOMORROW" : `IN ${soonest.daysUntil} DAYS`;
  const extra = notes.length > 1 ? ` · +${notes.length-1} more` : "";

  strip.innerHTML = `
    <div class="radar-strip">
      ⚠️ <b>${escapeHtml(soonest.text)}</b> — ${escapeHtml(soonest.sub)} · ${when}${extra}
    </div>
  `;
}

/* =========================================================
   CALENDAR EXPORT — weekly-recurring .ics file the person
   can import into Google/Apple/Outlook calendar.
   ========================================================= */
function pad2(n){ return n.toString().padStart(2,"0"); }

function nextDateForDow(targetDow){
  const d = new Date();
  const diff = (targetDow - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + diff);
  return d;
}
function icsDate(date, h, m){
  return `${date.getFullYear()}${pad2(date.getMonth()+1)}${pad2(date.getDate())}T${pad2(h)}${pad2(m)}00`;
}
const BYDAY = ["SU","MO","TU","WE","TH","FR","SA"];

function exportCalendar(){
  let ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Class Routine//EN","CALSCALE:GREGORIAN"
  ];
  DATA.forEach(day=>{
    const classes = day.classes.filter(c => !c.batch || c.batch === currentGroup);
    classes.forEach((c, idx)=>{
      const subj = SUBJECTS[c.subj];
      const startDate = nextDateForDow(day.dow);
      const dtStart = icsDate(startDate, c.start[0], c.start[1]);
      const dtEnd = icsDate(startDate, c.end[0], c.end[1]);
      ics.push(
        "BEGIN:VEVENT",
        `UID:${currentSection}-${day.dow}-${idx}-${c.subj}@class-routine`,
        `DTSTART:${dtStart}`,
        `DTEND:${dtEnd}`,
        `RRULE:FREQ=WEEKLY;BYDAY=${BYDAY[day.dow]}`,
        `SUMMARY:${subj.name} (${currentSection})`,
        `LOCATION:Room ${c.room}${c.batch ? " " + c.batch : ""}`,
        `DESCRIPTION:Faculty: ${c.fac}`,
        "END:VEVENT"
      );
    });
  });
  ics.push("END:VCALENDAR");

  const blob = new Blob([ics.join("\r\n")], {type:"text/calendar"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${currentSection}-routine.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("📅 Calendar file downloaded — import it into your calendar app");
}

/* =========================================================
   BACKUP & RESTORE — download / restore notes, day-notes and
   attendance as a single JSON file (everything lives only in
   this browser otherwise, so this is the way to move devices).
   ========================================================= */
function showBackupOverlay(){
  const overlay = document.getElementById("backupOverlay");
  const inner = document.getElementById("backupCardInner");
  inner.innerHTML = `
    <div class="kicker">ON-DEVICE DATA</div>
    <h2>Backup &amp; Restore</h2>
    <p>Notes, day-notes and attendance live only<br>on this device. Back them up before you<br>clear your browser or switch phones.</p>
    <div class="backup-actions">
      <button id="downloadBackupBtn">⬇ DOWNLOAD BACKUP (.json)</button>
      <label for="restoreFile">⬆ RESTORE FROM FILE</label>
      <input type="file" id="restoreFile" accept="application/json">
    </div>
    <button class="back-link" id="backupCloseBtn">‹ CLOSE</button>
  `;
  overlay.style.display = "flex";

  document.getElementById("downloadBackupBtn").addEventListener("click", ()=>{
    const payload = {
      notes: loadNotes(),
      dayNotes: loadDayNotes(),
      attendance: loadAttendance(),
      exportedAt: new Date().toISOString()
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "class-routine-backup.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast("⬇ Backup downloaded");
  });

  document.getElementById("restoreFile").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const data = JSON.parse(reader.result);
        if(data.notes) saveNotes({...loadNotes(), ...data.notes});
        if(data.dayNotes) saveDayNotes({...loadDayNotes(), ...data.dayNotes});
        if(data.attendance) saveAttendance({...loadAttendance(), ...data.attendance});
        overlay.style.display = "none";
        showToast("✅ Backup restored");
        render();
      }catch(err){
        showToast("Could not read that file");
      }
    };
    reader.readAsText(file);
  });

  document.getElementById("backupCloseBtn").addEventListener("click", ()=>{
    overlay.style.display = "none";
  });
}

/* =========================================================
   LIVE COUNTDOWN — ticks the status banner every second
   without a full re-render.
   ========================================================= */
function tickCountdown(){
  if(!bannerTarget) return;
  const statusText = document.getElementById("statusText");
  if(!statusText) return;
  const n = new Date();
  const nowSec = n.getHours()*3600 + n.getMinutes()*60 + n.getSeconds();
  const untilSec = bannerTarget.untilMin * 60;
  let diff = untilSec - nowSec;
  if(diff < 0) diff = 0;
  const mm = Math.floor(diff/60), ss = diff%60;
  const cd = `${mm}:${ss.toString().padStart(2,"0")}`;
  if(bannerTarget.type === "current"){
    statusText.innerHTML = `IN PROGRESS · ${bannerTarget.label} ENDS <span class="countdown">${cd}</span>`;
  } else {
    statusText.innerHTML = `NEXT UP · ${bannerTarget.label} IN <span class="countdown">${cd}</span>`;
  }
  maybeNotify(diff, bannerTarget);
}
setInterval(tickCountdown, 1000);

/* =========================================================
   CLASS REMINDER NOTIFICATIONS
   ========================================================= */
function maybeNotify(diffSec, target){
  if(!notifyEnabled || target.type !== "next") return;
  if(diffSec > 300 || diffSec <= 0) return; // fire once inside the 5-min window
  const fireKey = `${currentSection}-${activeDow}-${target.label}-${target.untilMin}`;
  if(firedReminders.has(fireKey)) return;
  firedReminders.add(fireKey);
  if("Notification" in window && Notification.permission === "granted"){
    new Notification("Class starting soon", {
      body: `${target.label} starts at ${fmt([Math.floor(target.untilMin/60), target.untilMin%60])}`,
      icon: "icon-192.png"
    });
  } else {
    showToast(`⏰ ${target.label} starts soon!`);
  }
}

function setupNotifyBtn(){
  const btn = document.getElementById("notifyBtn");
  btn.classList.toggle("on", notifyEnabled);
  btn.addEventListener("click", async ()=>{
    if(!notifyEnabled){
      if("Notification" in window && Notification.permission !== "granted"){
        try{ await Notification.requestPermission(); } catch(e){}
      }
      notifyEnabled = true;
      localStorage.setItem(NOTIFY_KEY, "1");
      showToast("🔔 Reminders on — you'll be nudged 5 min before class");
    } else {
      notifyEnabled = false;
      localStorage.setItem(NOTIFY_KEY, "0");
      showToast("🔕 Reminders off");
    }
    btn.classList.toggle("on", notifyEnabled);
  });
}

/* =========================================================
   SHARE TODAY'S ROUTINE
   ========================================================= */
function buildShareText(){
  const day = DATA.find(d=>d.dow===activeDow);
  const lines = [`📋 ${currentSection} · GROUP ${currentGroup} — ${day.full.toUpperCase()}`];
  if(lastVisibleClasses.length === 0){
    lines.push("No classes today 🎉");
  } else {
    lastVisibleClasses.forEach(c=>{
      lines.push(`${fmt(c.start)}–${fmt(c.end)}  ${SUBJECTS[c.subj].name}  (Room ${c.room}${c.batch ? " "+c.batch : ""})`);
    });
  }
  const dn = loadDayNotes()[dayNoteKey(currentSection, day.dow)];
  if(dn) lines.push(`\n📝 Note: ${dn}`);
  return lines.join("\n");
}

function setupShareBtn(){
  document.getElementById("shareBtn").addEventListener("click", async ()=>{
    const text = buildShareText();
    if(navigator.share){
      try{ await navigator.share({title:"Class Routine", text}); return; }
      catch(e){ /* user cancelled or unsupported, fall through */ }
    }
    try{
      await navigator.clipboard.writeText(text);
      showToast("📋 Copied today's routine to clipboard");
    }catch(e){
      showToast("Could not copy — please try again");
    }
  });
}

function showToast(msg){
  const t = document.getElementById("toast");
  if(!t) return;
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=> t.classList.remove("show"), 2600);
}

/* =========================================================
   SWIPE BETWEEN DAYS
   ========================================================= */
function setupSwipe(){
  const board = document.getElementById("board");
  let touchStartX = null, touchStartY = null;
  board.addEventListener("touchstart", (e)=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive:true});
  board.addEventListener("touchend", (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    touchStartX = null;
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.4) return;
    const idx = DATA.findIndex(d=>d.dow===activeDow);
    if(dx < 0 && idx < DATA.length - 1){
      activeDow = DATA[idx+1].dow; render();
    } else if(dx > 0 && idx > 0){
      activeDow = DATA[idx-1].dow; render();
    }
  }, {passive:true});
}

document.getElementById("board").addEventListener("click", (e)=>{
  const aBtn = e.target.closest(".attend-btn");
  if(aBtn){
    const subj = aBtn.dataset.subj;
    const status = aBtn.classList.contains("p") ? "present" : "absent";
    markAttendance(subj, status);
    showToast(status === "present"
      ? `✓ Marked present — ${SUBJECTS[subj].name}`
      : `✕ Marked absent — ${SUBJECTS[subj].name}`);
    render();
    return;
  }

  const btn = e.target.closest(".note-btn");
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const c = lastVisibleClasses.find(cl => cl._idx === idx);
  if(!c) return;
  showNoteModal(idx, SUBJECTS[c.subj].name);
});

function showNoteModal(idx, subjName){
  const day = DATA.find(d=>d.dow===activeDow);
  const key = noteKey(currentSection, day.dow, idx);
  const notes = loadNotes();
  const existing = notes[key] || "";

  noteOverlay.style.display = "flex";
  noteCardInner.innerHTML = `
    <div class="kicker">CLASS NOTE</div>
    <h2>${escapeHtml(subjName)}</h2>
    <p>Class test, exam বা যেকোনো reminder<br>এখানে লিখে রাখুন। শুধু এই ডিভাইসে সেভ থাকবে।</p>
    <input id="noteInput" type="text" maxlength="40" placeholder="যেমন: Class Test" value="${escapeHtml(existing)}">
    <div class="select-options note-actions" style="margin-top:22px;">
      <button id="noteSaveBtn">SAVE</button>
      ${existing ? '<button id="noteDeleteBtn">REMOVE</button>' : ""}
    </div>
    <button class="back-link" id="noteCancelBtn">‹ CANCEL</button>
  `;

  const input = document.getElementById("noteInput");
  input.focus();
  input.select();

  document.getElementById("noteSaveBtn").addEventListener("click", ()=>{
    const val = input.value.trim();
    const notes2 = loadNotes();
    if(val){ notes2[key] = val; } else { delete notes2[key]; }
    saveNotes(notes2);
    noteOverlay.style.display = "none";
    render();
  });

  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") document.getElementById("noteSaveBtn").click();
  });

  const delBtn = document.getElementById("noteDeleteBtn");
  if(delBtn){
    delBtn.addEventListener("click", ()=>{
      const notes2 = loadNotes();
      delete notes2[key];
      saveNotes(notes2);
      noteOverlay.style.display = "none";
      render();
    });
  }

  document.getElementById("noteCancelBtn").addEventListener("click", ()=>{
    noteOverlay.style.display = "none";
  });
}

function tickClock(){

  const days=["SUN","MON","TUE","WED","THU","FRI","SAT"];
  document.getElementById("clock").textContent =
    `${days[d.getDay()]} ${fmt([d.getHours(), d.getMinutes()])}`;
}

function updateBadge(){
  sectionBadge.innerHTML = `
    <div class="section-badge">
      ${currentSection} · GROUP ${currentGroup}
      <button id="changeBtn">CHANGE</button>
    </div>`;
  document.getElementById("changeBtn").addEventListener("click", showSectionStep);
}

function startWith(section, group){
  currentSection = section;
  currentGroup = group;
  DATA = SECTIONS[section].days;
  pageTitle.innerHTML = `SECTION <span>${section}</span>`;
  activeDow = DATA.some(d=>d.dow===nowDow) ? nowDow : DATA[0].dow;

  overlay.style.display = "none";
  buildDayNav();
  updateBadge();
  render();
}

function saveAndStart(section, group){
  localStorage.setItem(SEC_KEY, section);
  localStorage.setItem(GRP_KEY, group);
  startWith(section, group);
}

function showGroupStep(section){
  const groups = SECTIONS[section].groups;
  selectCardInner.innerHTML = `
    <div class="kicker">GROUP SELECT</div>
    <h2>Choose Your Group</h2>
    <p>Section ${section} splits into ${groups.join(" / ")}<br>for lab classes. Saved on this device.</p>
    <div class="select-options">
      ${groups.map(g => `<button data-group="${g}">${g}<span class="tag">GROUP ${g}</span></button>`).join("")}
    </div>
    <button class="back-link" id="backBtn">‹ BACK TO SECTION</button>
  `;
  selectCardInner.querySelectorAll("[data-group]").forEach(btn=>{
    btn.addEventListener("click", ()=> saveAndStart(section, btn.dataset.group));
  });
  document.getElementById("backBtn").addEventListener("click", showSectionStep);
}

function showSectionStep(){
  overlay.style.display = "flex";
  const sections = Object.keys(SECTIONS);
  selectCardInner.innerHTML = `
    <div class="kicker">SECTION SELECT</div>
    <h2>Choose Your Section</h2>
    <p>Selected once, this is saved<br>on this device.</p>
    <div class="select-options three">
      ${sections.map(s => `<button data-section="${s}">${s}</button>`).join("")}
    </div>
  `;
  selectCardInner.querySelectorAll("[data-section]").forEach(btn=>{
    btn.addEventListener("click", ()=> showGroupStep(btn.dataset.section));
  });
}

(function(){
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if(isStandalone) return;

  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

  const btn = document.createElement("button");
  btn.id = "installAppBtn";
  btn.textContent = "📲 Install App";
  btn.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#f2c94c;color:#132720;font-weight:700;border:none;border-radius:999px;padding:12px 22px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.4);display:none;cursor:pointer;font-family:inherit;";
  document.body.appendChild(btn);

  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredPrompt = e;
    btn.style.display = "block";
  });

  btn.addEventListener("click", async ()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      btn.style.display = "none";
    } else if(isIOS){
      showIOSHint();
    }
  });

  window.addEventListener("appinstalled", ()=>{
    btn.style.display = "none";
  });

  function showIOSHint(){
    let hint = document.getElementById("iosInstallHint");
    if(hint){ hint.style.display = "flex"; return; }
    hint = document.createElement("div");
    hint.id = "iosInstallHint";
    hint.style.cssText = "position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;font-family:inherit;";
    hint.innerHTML = `
      <div style="background:#20443a;color:#f4f1e4;width:100%;max-width:420px;border-radius:20px 20px 0 0;padding:20px;text-align:center;border-top:2px dashed rgba(244,241,228,0.25);">
        <p style="margin:0 0 10px;font-weight:700;">Install করতে নিচের ধাপগুলো অনুসরণ করুন:</p>
        <p style="margin:0 0 6px;">1. নিচের Share বাটনে (⬆️) ট্যাপ করুন</p>
        <p style="margin:0 0 14px;">2. "Add to Home Screen" সিলেক্ট করুন</p>
        <button id="iosHintClose" style="background:#f2c94c;color:#132720;font-weight:700;border:none;border-radius:999px;padding:10px 20px;">বুঝেছি</button>
      </div>`;
    document.body.appendChild(hint);
    document.getElementById("iosHintClose").addEventListener("click", ()=>{ hint.style.display = "none"; });
  }

   
  if(isIOS){
    btn.style.display = "block";
  }
})();
</script>
